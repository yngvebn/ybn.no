# Generated by npm run build. The stylesheet hash must match index.html.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'sha256-UrXO6Ti3Vw09GTutMb2iciWHYDPZF6Aa+uaC4JE2Vr8='; style-src-attr 'none'; img-src 'self' data:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HTTPS terminates at the existing proxy. Browsers ignore this on plain HTTP.
    # Initial host-only rollout: no includeSubDomains and no preload.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
